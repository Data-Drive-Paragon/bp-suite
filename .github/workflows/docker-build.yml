name: Build and Push Docker Images to Docker Hub

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
  release:
    types: [created]

env:
  DOCKER_REGISTRY: docker.io
  DOCKER_IMAGE_PATH: ${{ secrets.DOCKER_IMAGE_PATH || github.repository }}

jobs:
  build-and-push-big-paragon:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Extract metadata for Big Paragon
        id: meta-big-paragon
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_IMAGE_PATH }}/big-paragon
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Big Paragon image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta-big-paragon.outputs.tags }}
          labels: ${{ steps.meta-big-paragon.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export Big Paragon image
        if: github.event_name == 'release'
        run: |
          docker pull ${{ steps.meta-big-paragon.outputs.tags }}
          docker save ${{ steps.meta-big-paragon.outputs.tags }} -o big-paragon-image.tar
          gzip big-paragon-image.tar

      - name: Upload Big Paragon image to Release
        if: github.event_name == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: big-paragon-image
          path: big-paragon-image.tar.gz

  build-and-push-hami:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Extract metadata for Hami
        id: meta-hami
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_IMAGE_PATH }}/hami
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Hami image
        uses: docker/build-push-action@v5
        with:
          context: ./hami
          file: ./hami/Dockerfile
          push: true
          tags: ${{ steps.meta-hami.outputs.tags }}
          labels: ${{ steps.meta-hami.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export Hami image
        if: github.event_name == 'release'
        run: |
          docker pull ${{ steps.meta-hami.outputs.tags }}
          docker save ${{ steps.meta-hami.outputs.tags }} -o hami-image.tar
          gzip hami-image.tar

      - name: Upload Hami image to Release
        if: github.event_name == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: hami-image
          path: hami-image.tar.gz

  upload-to-release:
    runs-on: ubuntu-latest
    needs: [build-and-push-big-paragon, build-and-push-hami]
    if: github.event_name == 'release'
    steps:
      - name: Download Big Paragon image
        uses: actions/download-artifact@v4
        with:
          name: big-paragon-image

      - name: Download Hami image
        uses: actions/download-artifact@v4
        with:
          name: hami-image

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            big-paragon-image.tar.gz
            hami-image.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

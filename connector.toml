image = "dperson/samba:latest"
container_name = "samba-coordinator"
host_port = 34451
container_port = 445
volume = "/mnt/paragon_storage/001:/mnt/disk1"
timezone = "Europe/Moscow"
user = "john"
smb_password = "qQp9BA3CTfctG6iZWr7jSPHdFR"
share_name = "001"
host = "localhost"
port = 34451

# Big Paragon API
[big_paragon]
container_name = "big_paragon_api"
network_mode = "host"
build_context = "."
dockerfile = "Dockerfile"
config_mount = "./config.toml:/app/config.toml"
datasets_mount = "./big_paragon/datasets:/app/datasets"
linkers_mount = "./big_paragon/linkers:/app/linkers"
depends_on = ["postgres_node_1", "postgres_node_2", "postgres_node_3", "coordinator_clickhouse", "tailscale"]

# Hami Service
[hami]
container_name = "hami_service"
host_port = 21995
container_port = 3000
build_context = "./hami"
dockerfile = "Dockerfile"
env_file = "./hami/.env"
depends_on = ["postgres_octagon_extra"]
host = "localhost"
port = 21995

# Hami Bot
[hami_bot]
container_name = "hami_bot"
build_context = "./hami"
dockerfile = "Dockerfile"
command = "bun run bot"
env_file = "./hami/.env"
depends_on = ["postgres_octagon_extra"]


# PostgreSQL Node 3
# Connection settings are in pool.toml
[postgres_node_3]
image = "postgres:18-alpine"
container_name = "pg_node_3"
host_port = 29503
container_port = 5432
volume = "/run/media/john/media2/pg3-node3:/var/lib/postgresql"
volume_type = "bind"
shm_size = "512mb"
shared_buffers = "256MB"
work_mem = "16MB"
maintenance_work_mem = "128MB"
effective_cache_size = "768MB"
max_wal_size = "2GB"

# PostgreSQL Node 4
# Connection settings are in pool.toml
[postgres_node_4]
image = "postgres:18-alpine"
container_name = "pg_node_4"
host_port = 29504
container_port = 5432
volume = "/mnt/pg-node4:/var/lib/postgresql"
volume_type = "bind"
shm_size = "2gb"
shared_buffers = "4GB"
work_mem = "64MB"
maintenance_work_mem = "512MB"
effective_cache_size = "12GB"
max_wal_size = "8GB"
checkpoint_timeout = "15min"


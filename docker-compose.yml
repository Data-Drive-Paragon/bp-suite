include:
  - path: docker-compose.infra.yml
  - path: docker-compose.storage.yml

services:
  postgres_node_1:
    image: postgres:18-alpine
    container_name: pg_node_1
    restart: always
    ports:
      - "29501:5432"
    labels:
      - "paragon.node=true"
    shm_size: '512mb'
    command: >
      postgres
      -c fsync=off
      -c synchronous_commit=off
      -c full_page_writes=off
      -c shared_buffers=256MB
      -c work_mem=16MB
      -c maintenance_work_mem=128MB
      -c effective_cache_size=768MB
      -c max_wal_size=2GB
      -c checkpoint_completion_target=0.9
    environment:
      POSTGRES_USER: octagon
      POSTGRES_PASSWORD: 7abd4f68488bb50ad5d7d35227d38be6b8d1b5f49328866a4c2bf52b40234d66
      POSTGRES_DB: octagon
    volumes:
      - pg_data_1:/var/lib/postgresql

  postgres_node_2:
    image: postgres:18-alpine
    container_name: pg_node_2
    restart: always
    ports:
      - "29502:5432"
    labels:
      - "paragon.node=true"
    shm_size: '512mb'
    command: >
      postgres
      -c fsync=off
      -c synchronous_commit=off
      -c full_page_writes=off
      -c shared_buffers=256MB
      -c work_mem=16MB
      -c maintenance_work_mem=128MB
      -c effective_cache_size=768MB
      -c max_wal_size=2GB
      -c checkpoint_completion_target=0.9
    environment:
      POSTGRES_USER: octagon
      POSTGRES_PASSWORD: 7abd4f68488bb50ad5d7d35227d38be6b8d1b5f49328866a4c2bf52b40234d66
      POSTGRES_DB: octagon
    volumes:
      - pg_data_2:/var/lib/postgresql

  postgres_node_3:
    image: postgres:18-alpine
    container_name: pg_node_3
    restart: always
    ports:
      - "29503:5432"
    labels:
      - "paragon.node=true"
    shm_size: '512mb'
    command: >
      postgres
      -c fsync=off
      -c synchronous_commit=off
      -c full_page_writes=off
      -c shared_buffers=256MB
      -c work_mem=16MB
      -c maintenance_work_mem=128MB
      -c effective_cache_size=768MB
      -c max_wal_size=2GB
      -c checkpoint_completion_target=0.9
    environment:
      POSTGRES_USER: octagon
      POSTGRES_PASSWORD: 7abd4f68488bb50ad5d7d35227d38be6b8d1b5f49328866a4c2bf52b40234d66
      POSTGRES_DB: octagon
    volumes:
      - /run/media/john/media2/pg3-node3:/var/lib/postgresql
  postgres_node_4:
    image: postgres:18-alpine
    container_name: pg_node_4
    restart: always
    ports:
      - "29504:5432"
    labels:
      - "paragon.node=true"
    shm_size: '2gb' # Даем больше места под разделяемую память (shared memory) для тяжелых запросов
    command: >
      postgres
      -c fsync=off
      -c synchronous_commit=off
      -c full_page_writes=off
      -c shared_buffers=4GB
      -c work_mem=64MB
      -c maintenance_work_mem=512MB
      -c effective_cache_size=12GB
      -c max_wal_size=8GB
      -c checkpoint_completion_target=0.9
      -c checkpoint_timeout=15min
    environment:
      POSTGRES_USER: octagon
      POSTGRES_PASSWORD: 7abd4f68488bb50ad5d7d35227d38be6b8d1b5f49328866a4c2bf52b40234d66
      POSTGRES_DB: octagon
    volumes:
      - /mnt/pg-node4:/var/lib/postgresql

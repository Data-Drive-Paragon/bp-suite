  pg_data_1:
    driver: local
    driver_opts:
      type: "cifs"
      device: "//100.87.196.12/pg3-node1"
      o: "username=wireforce.usa@hotmail.com,password=rEkmoc-ginko2-rywjeg,vers=2.1,uid=70,gid=70,file_mode=0700,dir_mode=0700,cache=loose,rsize=1048576,wsize=1048576,actimeo=60,nostrictsync,noperm,nounix"
  pg_data_2:
